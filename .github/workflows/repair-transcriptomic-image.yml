name: Repair transcriptomic image

on:
  push:
    paths:
      - '.github/workflows/repair-transcriptomic-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact image bytes
        run: |
          base64 -d assets/img/publications/transcriptomic-convergence-evidence-map-v2.base64.txt > assets/img/publications/transcriptomic-convergence-evidence-map-v2.jpg
          file assets/img/publications/transcriptomic-convergence-evidence-map-v2.jpg
      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/publications/transcriptomic-convergence-evidence-map-v2.jpg
          git commit -m "Repair transcriptomic publication image bytes" || exit 0
          git push
