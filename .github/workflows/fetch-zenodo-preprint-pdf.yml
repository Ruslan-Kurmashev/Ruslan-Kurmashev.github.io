name: Archive Zenodo preprint PDF

on:
  push:
    paths:
      - '.github/workflows/fetch-zenodo-preprint-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF from Zenodo record
        shell: bash
        run: |
          set -euo pipefail
          record='18250085'
          dest='publications/transfer-learning-autism/kurmashev-2026-transfer-learning-autdb.pdf'
          meta="$(mktemp)"
          curl -A 'Mozilla/5.0' --retry 3 -fL "https://zenodo.org/api/records/${record}" -o "$meta"
          url=$(python3 - "$meta" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          files=d.get('files', [])
          pdfs=[]
          for f in files:
              key=(f.get('key') or '').lower()
              typ=((f.get('type') or '') + ' ' + (f.get('mimetype') or '')).lower()
              if key.endswith('.pdf') or 'application/pdf' in typ:
                  u=(f.get('links') or {}).get('self') or (f.get('links') or {}).get('content')
                  if u:
                      pdfs.append(u)
          print(pdfs[0] if pdfs else '')
          PY
          )
          test -n "$url"
          tmp="$(mktemp)"
          curl -A 'Mozilla/5.0' --retry 3 -fL "$url" -o "$tmp"
          test "$(head -c 4 "$tmp")" = '%PDF'
          mkdir -p "$(dirname "$dest")"
          cp "$tmp" "$dest"
          echo "Archived $dest ($(wc -c < "$dest") bytes)"
      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/transfer-learning-autism/kurmashev-2026-transfer-learning-autdb.pdf
          if git diff --cached --quiet; then
            echo 'No PDF change.'
            exit 0
          fi
          git commit -m 'Archive Zenodo preprint PDF'
          git push
