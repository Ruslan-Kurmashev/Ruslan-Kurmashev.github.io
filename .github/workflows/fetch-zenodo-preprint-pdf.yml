name: Archive Zenodo preprint PDF

on:
  push:
    paths:
      - '.github/workflows/fetch-zenodo-preprint-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download author-held CC BY preprint PDF
        shell: bash
        run: |
          set -euo pipefail
          dest='publications/transfer-learning-autism/kurmashev-2026-transfer-learning-autdb.pdf'
          tmp="$(mktemp)"
          # Author-held copy of the Zenodo v1 preprint (CC BY 4.0).
          url='https://drive.usercontent.google.com/download?id=1m3E_xRh80HYNe3DaYBpWwvGTWWuD77LH&export=download&confirm=t'
          curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$url" -o "$tmp"
          test "$(head -c 4 "$tmp")" = '%PDF'
          mkdir -p "$(dirname "$dest")"
          cp "$tmp" "$dest"
          echo "Archived $dest ($(wc -c < "$dest") bytes)"
      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/transfer-learning-autism/kurmashev-2026-transfer-learning-autdb.pdf
          if git diff --cached --quiet; then
            echo 'No PDF change.'
            exit 0
          fi
          git commit -m 'Archive Zenodo preprint PDF'
          git push
