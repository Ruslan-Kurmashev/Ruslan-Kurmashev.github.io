name: Archive open-access publication PDFs

on:
  push:
    paths:
      - '.github/workflows/archive-open-access-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Download verified open-access PDFs
        shell: bash
        run: |
          set -u

          is_pdf() {
            test -s "$1" && test "$(head -c 4 "$1")" = '%PDF'
          }

          save_direct() {
            local url="$1" dest="$2"
            local tmp
            tmp="$(mktemp)"
            echo "Trying $url"
            if curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$url" -o "$tmp" && is_pdf "$tmp"; then
              mkdir -p "$(dirname "$dest")"
              cp "$tmp" "$dest"
              echo "Archived $dest ($(wc -c < "$dest") bytes)"
              return 0
            fi
            echo "Direct PDF fetch failed: $url"
            return 1
          }

          save_page_pdf() {
            local page="$1" dest="$2"
            local html pdf_url tmp
            html="$(mktemp)"
            tmp="$(mktemp)"
            echo "Discovering PDF from $page"
            if ! curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$page" -o "$html"; then
              echo "Could not fetch page: $page"
              return 1
            fi
            pdf_url=$(python3 - "$html" "$page" <<'PY'
          import re, sys
          from html import unescape
          from urllib.parse import urljoin
          html = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          base = sys.argv[2]
          links = [unescape(x) for x in re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I)]
          pdfs = [urljoin(base, x) for x in links if '.pdf' in x.lower()]
          preferred = [x for x in pdfs if any(k in x.lower() for k in ('article','journal','sjmps','download','pdf'))]
          print((preferred or pdfs)[0] if (preferred or pdfs) else '')
          PY
            )
            test -n "$pdf_url" || { echo "No PDF link found on $page"; return 1; }
            echo "Found PDF: $pdf_url"
            if curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$pdf_url" -o "$tmp" && is_pdf "$tmp"; then
              mkdir -p "$(dirname "$dest")"
              cp "$tmp" "$dest"
              echo "Archived $dest ($(wc -c < "$dest") bytes)"
              return 0
            fi
            echo "Discovered URL was not a valid PDF"
            return 1
          }

          save_pmc_aws() {
            local pmcid="$1" dest="$2"
            local version meta pdf_url tmp
            tmp="$(mktemp)"
            echo "Finding current PMC AWS version for $pmcid"

            # The current PMC Article Datasets service (Aug 2026+) stores article
            # versions as PMCID.version and exposes JSON metadata/PDFs via a
            # public S3 bucket. Most records are version 1, but try recent
            # versions in descending order so this remains robust.
            for version in 5 4 3 2 1; do
              meta="https://pmc-oa-opendata.s3.amazonaws.com/${pmcid}.${version}/${pmcid}.${version}.json"
              if curl -A 'Mozilla/5.0' --retry 2 --retry-delay 1 -fsL "$meta" -o "$tmp.meta"; then
                pdf_url=$(python3 - "$tmp.meta" <<'PY'
          import json, sys
          try:
              d=json.load(open(sys.argv[1], encoding='utf-8'))
              u=d.get('pdf_url') or ''
              if u.startswith('s3://pmc-oa-opendata/'):
                  u='https://pmc-oa-opendata.s3.amazonaws.com/'+u.split('s3://pmc-oa-opendata/',1)[1]
              print(u)
          except Exception:
              print('')
          PY
                )
                if [ -n "$pdf_url" ]; then
                  echo "PMC PDF: $pdf_url"
                  if curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$pdf_url" -o "$tmp" && is_pdf "$tmp"; then
                    mkdir -p "$(dirname "$dest")"
                    cp "$tmp" "$dest"
                    echo "Archived $dest ($(wc -c < "$dest") bytes)"
                    return 0
                  fi
                fi
              fi
            done
            echo "No downloadable PDF found in PMC AWS for $pmcid"
            return 1
          }

          # 2025 original research - CC BY-NC 4.0 in the final published PDF.
          save_page_pdf \
            'https://saudijournals.com/articles/13073/' \
            'publications/age-moderation-abide/kurmashev-2025-age-moderation-abide.pdf' || true

          # 2026 Wiley open-access article. Wiley blocks GitHub Actions PDF
          # requests; leave the canonical DOI/publisher links in place until a
          # clean author/publisher PDF is available locally.
          save_direct \
            'https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ajmg.b.70025' \
            'publications/ube3a-dosage-autism/kurmashev-2026-ube3a-dosage.pdf' || true

          # Open-access articles available through the current PMC AWS service.
          save_pmc_aws \
            'PMC13348487' \
            'publications/transcriptomic-convergence-asd/kurmashev-2026-transcriptomic-convergence.pdf' || true

          save_pmc_aws \
            'PMC13475711' \
            'publications/early-autism-identification/kurmashev-2026-early-autism-identification.pdf' || true

          save_pmc_aws \
            'PMC13264101' \
            'publications/cortical-transcriptomics-asd/kurmashev-2026-cortical-transcriptomics.pdf' || true

          # 2026 UniversePG article; public publisher PDF.
          save_direct \
            'https://www.universepg.com/public/img/storage/journal-pdf/1783958547_Transcriptomic_signatures_in_autism_spectrum_disorder_opportunities.pdf' \
            'publications/transcriptomic-signatures-asd/kurmashev-2026-transcriptomic-signatures.pdf' || true

      - name: Commit archived PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/**/*.pdf
          if git diff --cached --quiet; then
            echo 'No new or changed PDFs to commit.'
            exit 0
          fi
          git commit -m 'Archive open-access publication PDFs'
          git push
