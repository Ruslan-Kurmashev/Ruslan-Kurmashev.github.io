name: Fetch UBE3A open-access PDF

on:
  push:
    paths:
      - '.github/workflows/fetch-ube3a-author-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download author-held CC BY publisher PDF
        shell: bash
        run: |
          set -euo pipefail
          dest='publications/ube3a-dosage-autism/kurmashev-2026-ube3a-dosage.pdf'
          tmp="$(mktemp)"
          # This is the author's archived Version of Record on Google Drive.
          # The published article is CC BY 4.0; no sharing permissions are changed here.
          url='https://drive.usercontent.google.com/download?id=1IfNZstYRdqSHBQpn8n3JhF5ypAVc92aS&export=download&confirm=t'
          curl -A 'Mozilla/5.0' --retry 3 --retry-delay 2 -fL "$url" -o "$tmp"
          test "$(head -c 4 "$tmp")" = '%PDF'
          mkdir -p "$(dirname "$dest")"
          cp "$tmp" "$dest"
          echo "Downloaded $(wc -c < "$dest") bytes"
      - name: Commit PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/ube3a-dosage-autism/kurmashev-2026-ube3a-dosage.pdf
          if git diff --cached --quiet; then
            echo 'No PDF change.'
            exit 0
          fi
          git commit -m 'Archive UBE3A open-access Version of Record PDF'
          git push
