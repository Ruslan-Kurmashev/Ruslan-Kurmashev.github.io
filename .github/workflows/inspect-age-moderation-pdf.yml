name: Install age moderation publication thumbnail

on:
  push:
    paths:
      - '.github/workflows/inspect-age-moderation-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract original figure from publication PDF
        shell: bash
        run: |
          set -euo pipefail
          command -v pdfimages || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          mkdir -p /tmp/age-moderation
          pdfimages -f 12 -l 12 -j publications/age-moderation-abide/kurmashev-2025-age-moderation-abide.pdf /tmp/age-moderation/fig
          ls -lh /tmp/age-moderation
          test -f /tmp/age-moderation/fig-000.jpg
          cp /tmp/age-moderation/fig-000.jpg assets/img/publications/age-moderation-abide-social-age.jpg
          file assets/img/publications/age-moderation-abide-social-age.jpg

      - name: Add thumbnail to publication listings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/js/main.js')
          s = p.read_text()

          if '.pub-item-with-plot {' not in s:
              s = s.replace(
                  "  .pub-item-with-evidence .pub-thumb img { object-fit: contain; object-position: center; }\n",
                  "  .pub-item-with-evidence .pub-thumb img { object-fit: contain; object-position: center; }\n"
                  "  .pub-item-with-plot { grid-template-columns: 220px minmax(0, 1fr); }\n"
                  "  .pub-item-with-plot .pub-thumb { width: 220px; height: 181px; }\n"
                  "  .pub-item-with-plot .pub-thumb img { object-fit: contain; object-position: center; }\n"
              )
              s = s.replace(
                  "    .pub-item-with-thumb, .pub-item-with-cover, .pub-item-with-evidence { grid-template-columns: 1fr; gap: 12px; }\n",
                  "    .pub-item-with-thumb, .pub-item-with-cover, .pub-item-with-evidence, .pub-item-with-plot { grid-template-columns: 1fr; gap: 12px; }\n"
              )
              s = s.replace(
                  "    .pub-item-with-evidence .pub-thumb { width: min(260px, 100%); height: auto; aspect-ratio: 1.87; }\n",
                  "    .pub-item-with-evidence .pub-thumb { width: min(260px, 100%); height: auto; aspect-ratio: 1.87; }\n"
                  "    .pub-item-with-plot .pub-thumb { width: min(260px, 100%); height: auto; aspect-ratio: 1.196; }\n"
              )

          if "variant === 'plot'" not in s:
              s = s.replace(
                  "    if (variant === 'evidence') article.classList.add('pub-item-with-evidence');\n",
                  "    if (variant === 'evidence') article.classList.add('pub-item-with-evidence');\n"
                  "    if (variant === 'plot') article.classList.add('pub-item-with-plot');\n"
              )

          block = """\naddPublicationThumbnail(\n  '/publications/age-moderation-abide/',\n  '/assets/img/publications/age-moderation-abide-social-age.jpg',\n  'Social by age interaction in bilateral caudate volume with observed age distribution',\n  'plot'\n);\n"""

          if "'/publications/age-moderation-abide/'" not in s:
              marker = "\n// Navigation asset version:"
              s = s.replace(marker, block + marker)

          s = s.replace('// Navigation asset version: 2026-09-14-4', '// Navigation asset version: 2026-09-14-5')
          p.write_text(s)
          PY

      - name: Commit thumbnail and clean up workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-age-moderation-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/publications/age-moderation-abide-social-age.jpg assets/js/main.js .github/workflows/inspect-age-moderation-pdf.yml
          git commit -m 'Add age moderation publication figure thumbnail'
          git push
