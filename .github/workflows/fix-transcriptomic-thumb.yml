name: Fix transcriptomic publication thumbnail

on:
  push:
    paths:
      - '.github/workflows/fix-transcriptomic-thumb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make transcriptomic thumbnail static
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          href = '/publications/transcriptomic-convergence-asd/'
          img = '/assets/img/publications/transcriptomic-convergence-evidence-map-v2.jpg'
          alt = 'Evidence profile and study strength summary for the transcriptomic convergence review'

          home = Path('index.html')
          s = home.read_text()
          pattern = re.compile(r'<article class="pub-item">(?:(?!</article>).)*?<h3 class="pub-title"><a href="/publications/transcriptomic-convergence-asd/">(?:(?!</article>).)*?</article>', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Transcriptomic article not found in index.html')
          block = m.group(0)
          inner = re.sub(r'^<article class="pub-item">\s*|\s*</article>$', '', block, flags=re.S)
          new = f'''<article class="pub-item pub-item-with-thumb pub-item-with-evidence">
          <a class="pub-thumb" href="{href}" aria-label="Open transcriptomic convergence publication details">
            <img src="{img}" alt="{alt}" loading="lazy">
          </a>
          <div class="pub-copy">
{inner}
          </div>
        </article>'''
          s = s[:m.start()] + new + s[m.end():]
          s = re.sub(r'/assets/js/main\.js\?v=[^"\']+', '/assets/js/main.js?v=20260914-6', s)
          home.write_text(s)

          pubs = Path('publications/index.html')
          s = pubs.read_text()
          pattern = re.compile(r'<article class="pub-item">(?=[\s\S]*?<a href="/publications/transcriptomic-convergence-asd/">).*?</article>')
          # Search article-by-article to avoid crossing boundaries.
          matches = list(re.finditer(r'<article class="pub-item">.*?</article>', s, re.S))
          target = next((x for x in matches if href in x.group(0)), None)
          if not target:
              raise SystemExit('Transcriptomic article not found in publications/index.html')
          block = target.group(0)
          inner = re.sub(r'^<article class="pub-item">\s*|\s*</article>$', '', block, flags=re.S)
          new = f'''<article class="pub-item pub-item-with-thumb pub-item-with-evidence"><a class="pub-thumb" href="{href}" aria-label="Open transcriptomic convergence publication details"><img src="{img}" alt="{alt}" loading="lazy"></a><div class="pub-copy">{inner}</div></article>'''
          s = s[:target.start()] + new + s[target.end():]
          s = re.sub(r'/assets/js/main\.js\?v=[^"\']+', '/assets/js/main.js?v=20260914-6', s)
          pubs.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications/index.html
          git commit -m "Fix transcriptomic publication thumbnail" || exit 0
          git push
