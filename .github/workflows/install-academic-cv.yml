name: Install Academic CV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild approved CV PDF from staging branch
        run: |
          git fetch origin tmp-cv-pdf:refs/remotes/origin/tmp-cv-pdf
          for i in 00 01 02 03 04 05 06 07 08; do
            git show "origin/tmp-cv-pdf:.tmp-cv/cv-part-${i}.b64"
          done | tr -d '\n\r' | base64 -d > cv/ruslan-kurmashev-academic-cv.pdf
          test "$(wc -c < cv/ruslan-kurmashev-academic-cv.pdf)" -eq 56511
          file cv/ruslan-kurmashev-academic-cv.pdf

      - name: Add PDF download button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cv/index.html')
          s = p.read_text()
          needle = '<div class="cv-actions"><a class="btn" href="/publications/">Publications</a>'
          repl = '<div class="cv-actions"><a class="btn btn-primary" href="/cv/ruslan-kurmashev-academic-cv.pdf">Download Academic CV (PDF)</a><a class="btn" href="/publications/">Publications</a>'
          if '/cv/ruslan-kurmashev-academic-cv.pdf' not in s:
              if needle not in s:
                  raise SystemExit('CV actions marker not found')
              s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/install-academic-cv.yml

      - name: Commit final website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add downloadable academic CV PDF"
          git push origin HEAD:main
