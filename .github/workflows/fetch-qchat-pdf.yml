name: Archive Q-CHAT PDF

on:
  push:
    paths:
      - '.github/workflows/fetch-qchat-pdf.yml'

permissions:
  contents: write

jobs:
  archive-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Fetch published open-access Q-CHAT article
        shell: bash
        run: |
          set -euo pipefail
          DEST='publications/qchat-behavioral-domains/kurmashev-2024-qchat-autism.pdf'
          mkdir -p "$(dirname "$DEST")"
          TMP="$(mktemp)"

          # IJSR archive URLs follow /archive/v<volume>i<issue>/<paper-id>.pdf.
          DIRECT='https://www.ijsr.net/archive/v13i2/SR24229081124.pdf'
          if curl --retry 3 --retry-delay 2 -fL "$DIRECT" -o "$TMP"; then
            true
          else
            echo 'Direct archive URL failed; attempting to discover a PDF link from the article page.'
            PAGE="$(mktemp)"
            curl --retry 3 --retry-delay 2 -fL 'https://www.ijsr.net/getabstract.php?paperid=SR24229081124' -o "$PAGE"
            PDF_URL=$(python3 - "$PAGE" <<'PY'
          import re, sys
          from urllib.parse import urljoin
          html=open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          links=re.findall(r'href=["\']([^"\']+)["\']', html, flags=re.I)
          pdfs=[urljoin('https://www.ijsr.net/', x) for x in links if '.pdf' in x.lower()]
          print(pdfs[0] if pdfs else '')
          PY
            )
            test -n "$PDF_URL" || { echo 'No PDF URL found on IJSR article page'; exit 1; }
            curl --retry 3 --retry-delay 2 -fL "$PDF_URL" -o "$TMP"
          fi

          test "$(head -c 4 "$TMP")" = '%PDF' || { echo 'Downloaded file is not a PDF'; exit 1; }
          cp "$TMP" "$DEST"
          echo "Archived PDF size: $(wc -c < "$DEST") bytes"

      - name: Commit archived PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/qchat-behavioral-domains/kurmashev-2024-qchat-autism.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already current.'
            exit 0
          fi
          git commit -m 'Archive open-access Q-CHAT article PDF'
          git push
