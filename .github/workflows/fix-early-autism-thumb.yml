name: Fix early autism publication thumbnail

on:
  push:
    paths:
      - '.github/workflows/fix-early-autism-thumb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original published graphical abstract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.request
          import urllib.parse
          from pathlib import Path

          page = 'https://pmc.ncbi.nlm.nih.gov/articles/PMC13475711/'
          html = urllib.request.urlopen(page, timeout=30).read().decode('utf-8', 'ignore')
          matches = re.findall(r'''(?:src|href)=["']([^"']*PED4-9999-0-g001\.jpg[^"']*)["']''', html, flags=re.I)
          if not matches:
              raise SystemExit('Could not locate original graphical abstract URL in PMC page')
          url = urllib.parse.urljoin(page, matches[0])
          print('Downloading:', url)
          data = urllib.request.urlopen(url, timeout=30).read()
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Downloaded file is not a JPEG')
          out = Path('assets/img/publications/early-autism-identification-pathway.jpg')
          out.write_bytes(data)
          print('Bytes:', len(data))
          PY
          file assets/img/publications/early-autism-identification-pathway.jpg
          test -s assets/img/publications/early-autism-identification-pathway.jpg

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-early-autism-thumb.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/publications/early-autism-identification-pathway.jpg .github/workflows/fix-early-autism-thumb.yml
          git commit -m 'Use original high-quality early autism graphical abstract'
          git push
