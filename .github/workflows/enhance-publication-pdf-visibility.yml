name: Enhance publication PDF visibility

on:
  push:
    paths:
      - '.github/workflows/enhance-publication-pdf-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add PDF links and scholarly metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          site = 'https://ruslan-kurmashev.github.io'
          records = {
              'age-moderation-abide': 'kurmashev-2025-age-moderation-abide.pdf',
              'ube3a-dosage-autism': 'kurmashev-2026-ube3a-dosage.pdf',
              'transcriptomic-signatures-asd': 'kurmashev-2026-transcriptomic-signatures.pdf',
              'transcriptomic-convergence-asd': 'kurmashev-2026-transcriptomic-convergence.pdf',
              'early-autism-identification': 'kurmashev-2026-early-autism-identification.pdf',
              'cortical-transcriptomics-asd': 'kurmashev-2026-cortical-transcriptomics.pdf',
              'qchat-behavioral-domains': 'kurmashev-2024-qchat-autism.pdf',
          }

          def add_jsonld_encoding(html, full_url):
              pat = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S)
              m = pat.search(html)
              if not m:
                  return html
              try:
                  data = json.loads(m.group(2))
              except Exception:
                  return html
              if isinstance(data, dict) and data.get('@type') == 'ScholarlyArticle':
                  data['isAccessibleForFree'] = True
                  data['encoding'] = {
                      '@type': 'MediaObject',
                      'encodingFormat': 'application/pdf',
                      'contentUrl': full_url,
                  }
                  repl = m.group(1) + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + m.group(3)
                  html = html[:m.start()] + repl + html[m.end():]
              return html

          for slug, pdf in records.items():
              p = Path('publications') / slug / 'index.html'
              pdf_path = Path('publications') / slug / pdf
              if not p.exists() or not pdf_path.exists():
                  print('Skip missing:', slug, pdf_path)
                  continue
              html = p.read_text(encoding='utf-8')
              rel = f'/publications/{slug}/{pdf}'
              full = site + rel

              if 'name="citation_pdf_url"' not in html:
                  tag = f'<meta name="citation_pdf_url" content="{full}">'
                  html = html.replace('<link rel="stylesheet"', tag + '<link rel="stylesheet"', 1)

              hero_marker = '<div class="hero-actions">'
              pdf_button = f'<a class="btn" href="{rel}">PDF</a>'
              if hero_marker in html and pdf_button not in html:
                  html = html.replace(hero_marker, hero_marker + pdf_button, 1)

              html = add_jsonld_encoding(html, full)

              sidebar_pdf = f'<div><dt>PDF</dt><dd><a href="{rel}">Full text</a></dd></div>'
              if '<dt>PDF</dt>' not in html:
                  if '<div><dt>License</dt>' in html:
                      html = html.replace('<div><dt>License</dt>', sidebar_pdf + '<div><dt>License</dt>', 1)
                  elif '</dl>' in html:
                      html = html.replace('</dl>', sidebar_pdf + '</dl>', 1)

              p.write_text(html, encoding='utf-8')
              print('Enhanced:', p)

          pub_index = Path('publications/index.html')
          html = pub_index.read_text(encoding='utf-8')
          for slug, pdf in records.items():
              rel = f'/publications/{slug}/{pdf}'
              if rel in html:
                  continue
              pat = re.compile(r'(<article class="pub-item">(?:(?!</article>).)*?/publications/' + re.escape(slug) + r'/(?:(?!</article>).)*?<div class="pub-links">)(.*?)(</div></article>)', re.S)
              m = pat.search(html)
              if m:
                  links = m.group(2) + f'<a href="{rel}">PDF</a>'
                  html = html[:m.start()] + m.group(1) + links + m.group(3) + html[m.end():]
                  print('Added list PDF:', slug)
          pub_index.write_text(html, encoding='utf-8')

          home = Path('index.html')
          html = home.read_text(encoding='utf-8')
          for slug, pdf in records.items():
              rel = f'/publications/{slug}/{pdf}'
              if rel in html:
                  continue
              pat = re.compile(r'(<article class="pub-item">(?:(?!</article>).)*?/publications/' + re.escape(slug) + r'/(?:(?!</article>).)*?<div class="pub-links">)(.*?)(</div>\s*</article>)', re.S)
              m = pat.search(html)
              if m:
                  links = m.group(2) + f'<a href="{rel}">PDF</a>'
                  html = html[:m.start()] + m.group(1) + links + m.group(3) + html[m.end():]
                  print('Added home PDF:', slug)
          home.write_text(html, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          additions = []
          for slug, pdf in records.items():
              if not (Path('publications') / slug / pdf).exists():
                  continue
              full = f'{site}/publications/{slug}/{pdf}'
              if full not in sm:
                  additions.append(f'  <url><loc>{full}</loc></url>')
          if additions:
              sm = sm.replace('</urlset>', '\n'.join(additions) + '\n</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
              print('Added sitemap PDF URLs:', len(additions))
          PY

      - name: Commit visibility improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html publications sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Improve full-text publication discoverability'
          git push
